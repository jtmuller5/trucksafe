[project]
name = "trucksafe-training"
version = "0.1.0"
description = "Fine-tuning and labeling pipeline for the TruckSafe on-device inspection model."
readme = "README.md"
authors = [
    { name = "Joe Muller", email = "jtmuller5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

# TODO: heavy ML deps land when the labeling/training pipelines come online.
# Adding them now tends to wedge `uv lock` because of pinned CUDA/torch builds:
#   - unsloth (LoRA fine-tune)
#   - transformers, accelerate, peft, datasets
#   - vllm (labeler service)
#   - wandb (open question: do we want experiment tracking?)

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
